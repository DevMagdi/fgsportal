<div class="container">
    <div class="row m-2">
        <div class="col-12">
            <button class="btn addBtn" (click)="displayModal=true">New</button>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <table class="table table-hover tableCustom" id="costLogs">
                <thead>
                    <tr>
                        <td>Title</td>
                        <td>Body</td>
                        <td>status</td>
                        <td>Views</td>
                        <td></td>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let announce of myAnnounces">
                        <td class="dateStyle">{{announce.title}}</td>
                        <td>{{announce.body}}</td>
                        <td>{{announce.status == 0 ? 'RUNNING' : 'Closed' }}</td>
                        <td>
                            <span *ngIf="!!announce.viewedBy">
                                {{announce.viewedBy.length}}
                            </span>
                            <span *ngIf="!announce.viewedBy">
                                0
                            </span>
                            <span class="ml-1 pt-1 badge"><i class="pi pi-eye views" (mouseover)="getMyViews(announce.viewedBy)" matTooltip="{{myViews}}"></i></span>
                        </td>
                        <td>
                            <i class="pi pi-pencil editIcon mr-1" (click)="editAnnounce(announce);announceReview=true"></i>
                            <i class="pi pi-times closeIcon mx-1" (click)="closeAccounce(announce)"></i>
                            <i class="pi pi-trash deleteIcon ml-1" (click)="deleteAnnounce(announce)"></i>

                            <!-- <button class="btn addBtn" (click)="editAnnounce(announce);announceReview=true">Review</button>
                            <button class="btn addBtn">Delete</button> -->
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>
<p-dialog header="New Announce" [(visible)]="displayModal" [style]="{width: '50vw'}" [breakpoints]="{'960px': '50vw', '640px': '100vw'}" [modal]="true" [draggable]="false" [resizable]="false">

    <form [formGroup]="newAnnounceForm" (ngSubmit)="createNewAnnounce()" class="example-form">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12 my-3">
                    <mat-form-field class="example-full-width w-100">
                        <mat-label>Language</mat-label>
                        <mat-select formControlName="language">
                            <mat-option value='ltr'>English</mat-option>
                            <mat-option value='rtl'>Arabic</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-md-12 my-3">
                    <mat-form-field class="example-full-width w-100">
                        <mat-label>Title</mat-label>
                        <input matInput type="text" formControlName="title">
                    </mat-form-field>
                </div>

                <div class="col-md-12 my-3">
                    <label for="">Body:</label>
                    <p-editor formControlName="body" [modules]="quillOPT" [style]="{'height':'320px'}">
                        <ng-template pTemplate="header">
                            <span class="ql-format-group">
                            </span>
                        </ng-template>
                    </p-editor>

                    <!-- <mat-form-field class="example-full-width w-100"> -->

                    <!-- <mat-label>Body</mat-label> -->
                    <!-- <textarea matInput type="text" formControlName="body"></textarea> -->
                    <!-- </mat-form-field> -->
                </div>

                <div class="col-md-6 my-3">
                    <mat-form-field class="example-full-width w-100">
                        <mat-label>Assign To</mat-label>
                        <mat-select multiple formControlName="assignTo">
                            <mat-option value='All'>All</mat-option>
                            <mat-option [disabled]="newAnnounceForm.get(['assignTo'])?.value == 'All'" *ngFor="let user of allUsers" [value]='user.key'>{{user.username}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-md-6 my-3">
                    <img *ngIf="!!url" [src]="url" alt="" class="" width="150">
                    <br>
                    <button type="button" mat-raised-button (click)="fileInput.click()">Choose File</button>
                    <input hidden (change)="imageupload($event)" #fileInput type="file" id="file">
                </div>

                <div class="col-md-12 my-3">
                    <button class="btn submitBTN my-3" [disabled]="newAnnounceForm.invalid || loading" type="submit">{{loading? 'Loading....' : 'Submit' }}</button>
                </div>

            </div>
        </div>
        <ng-template pTemplate="footer">
            <!-- <p-button icon="pi pi-check" (click)="displayModal=false" label="Send To {{salaryForReview.empName}}" styleClass="p-button-text" (click)="saveSalaryAfterEdit('comment')"></p-button> -->
            <!-- <p-button icon="pi pi-check" (click)="displayModal=false" label="Ok" styleClass="p-button-text"></p-button> -->
        </ng-template>
    </form>


</p-dialog>


<p-dialog *ngIf="!!announceToEdit" header="Review Announce" [(visible)]="announceReview" [style]="{width: '50vw'}" [breakpoints]="{'960px': '50vw', '640px': '100vw'}" [modal]="true" [draggable]="false" [resizable]="false">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-6">

            </div>
        </div>
    </div>
    <form [formGroup]="newAnnounceForm" (ngSubmit)="updateAnnounce()" class="example-form">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12 my-3">
                    <mat-form-field class="example-full-width w-100">
                        <mat-label>Language</mat-label>
                        <mat-select formControlName="language">
                            <mat-option value='ltr'>English</mat-option>
                            <mat-option value='rtl'>Arabic</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-md-12 my-3">
                    <mat-form-field class="example-full-width w-100">
                        <mat-label>Title</mat-label>
                        <input matInput type="text" formControlName="title">
                    </mat-form-field>
                </div>

                <div class="col-md-12 my-3">
                    <label for="">Body:</label>
                    <p-editor formControlName="body" [style]="{'height':'320px'}"></p-editor>

                    <!-- <mat-form-field class="example-full-width w-100">
                        <mat-label>Body</mat-label>
                        <textarea matInput type="text" formControlName="body"></textarea>
                    </mat-form-field> -->
                </div>

                <div class="col-md-6 my-3">
                    <mat-form-field class="example-full-width w-100">
                        <mat-label>Assign To</mat-label>
                        <mat-select multiple formControlName="assignTo">
                            <mat-option value='All'>All</mat-option>
                            <mat-option [disabled]="newAnnounceForm.get(['assignTo'])?.value == 'All'" *ngFor="let user of allUsers" [value]='user.key'>{{user.username}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-md-6 my-3">
                    <img *ngIf="!!url" [src]="url" alt="" class="" width="150">
                    <br>
                    <button type="button" mat-raised-button (click)="fileInput.click()">Choose File</button>
                    <input hidden (change)="imageupload($event)" #fileInput type="file" id="file">
                </div>

                <div class="col-md-12 my-3">
                    <button class="btn submitBTN my-3" [disabled]="newAnnounceForm.invalid || loading" type="submit">{{loading? 'Loading....' : 'Submit' }}</button>
                </div>

            </div>
        </div>
        <ng-template pTemplate="footer">
            <p-button icon="pi pi-check" (click)="displayModal=false" label="Ok" styleClass="p-button-text"></p-button>
        </ng-template>
    </form>


</p-dialog>
