<div class="container mt-5">
    <div class="row">
        <div class="col-lg-6">
            <div class="projectsChart" *ngIf="loaded">
                <div style="display: block">
                    <canvas mdbChart [chartType]="projectsStatusChartType" [datasets]="projectsStatusChartDatasets" [labels]="projectsStatusChartLabels" [colors]="projectsStatusChartColors" [options]="projectsStatusChartOptions" [legend]="true" (chartHover)="projectsStatusChartHovered($event)"
                        (chartClick)="projectsStatusChartClicked($event)">
                    </canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="projectsChart" *ngIf="loaded">
                <div style="display: block">
                    <canvas mdbChart [chartType]="projectsTypeChartType" [datasets]="projectsTypeChartDatasets" [labels]="projectsTypeChartLabels" [colors]="projectsTypeChartColors" [options]="projectsTypeChartOptions" [legend]="true" (chartHover)="projectsTypeChartHovered($event)"
                        (chartClick)="projectsTypeChartClicked($event)">
                    </canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="co-12 w-75">
            <div class="devChart">
            </div>
        </div>
    </div>
</div>
