<div class="container">
    <div class="row m-3">
        <!-- <div class="col-lg-6">
            <p-card header="Add New Month Balance">

            </p-card>
        </div> -->
        <div class="col-lg-6">
            <p-card header="Reset Year Balance">
                <button class="btn mainBtn m-3" (click)="resetNewYearBalance()">Reset New Year Balance</button>
            </p-card>
        </div>
        <div class="col-6">
            <p-card header="Add Annual Pending Balance">

                <input class="form-control" type="number" [(ngModel)]="setUsersVacation">
                <mat-label class="inputLabel">Select Users</mat-label>
                <mat-select class="form-control customInput" multiple [(ngModel)]="selectedUser" [ngModelOptions]="{standalone: true}">
                    <mat-option value="all">All</mat-option>
                    <mat-option *ngFor="let user of allUsers" value="{{user.key}}">{{user.username}}</mat-option>
                </mat-select>
                <ng-template pTemplate="footer">
                    <button class="btn mainBtn m-3" (click)="submitEdits()">Submit</button>
                </ng-template>
            </p-card>
        </div>
    </div>
