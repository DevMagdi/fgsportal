<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-labelledby="title desc">
  <title id="title">FGS Connect</title>
  <desc id="desc">Soft gradient sphere from magenta pink to cyan blue</desc>
  <defs>
    <radialGradient id="sphere" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".16" stop-color="#a9e8f7"/>
      <stop offset=".48" stop-color="#22c5d6"/>
      <stop offset=".73" stop-color="#6989ee"/>
      <stop offset="1" stop-color="#e557a5"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e557a5"/>
      <stop offset="1" stop-color="#16b8cc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#27345b" flood-opacity=".16"/>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="36" fill="url(#sphere)" filter="url(#shadow)"/>
  <ellipse cx="37" cy="31" rx="14" ry="9" fill="#fff" opacity=".32" transform="rotate(-28 37 31)"/>
  <text x="100" y="48" fill="#263453" font-family="Cairo, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing=".2">FGS <tspan fill="url(#wordmark)">Connect</tspan></text>
  <text x="102" y="68" fill="#71809c" font-family="Cairo, Arial, sans-serif" font-size="10" letter-spacing="2.1">BUSINESS MANAGEMENT</text>
</svg>
