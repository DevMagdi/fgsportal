<p-blockUI style="width: 100vw; height: 100vh;" [blocked]="loading">
    <p-progressSpinner></p-progressSpinner>
</p-blockUI>
<div *ngIf="!loading " class="container-fluid">

    <div class="mb-4 mt-5 row text-start">
        <div class="col-md-9">
            <h1 class="main-color fw-bold" *ngIf="isManager">Project Manager Reports</h1>
            <h1 class="main-color fw-bold" *ngIf="isProjectManager">Monthly report to Manager</h1>

        </div>
       
        <div class="col-md-3 text-end" *ngIf="isProjectManager">

            <button (click)="sidebarDisplay=true" type="button" class="btn btnStyle">
                <i class="menu-icon tf-icons bx bx-plus"></i>
                Add new Report
            </button>
        </div>
       
    </div>
    <!-- <div class="row">
        <div data-aos="fade-down" class="col-12 text-center" *ngIf="!!recallGetMyReportsFunction || true">
            <button (click)="recallGetMyReports()" pButton pRipple type="button" icon="pi pi-replay"
             class="p-button-rounded p-button-info"></button>
        </div>
    </div> -->
    <hr class="main-color">

    <p-tabView *ngIf="isManager" [(activeIndex)]="activeIndex" (onChange)="loadReports($event)">
        <p-tabPanel header="My Pending Reports">

            <ng-template pTemplate="content">
                <div class="row align-items-end">
                    <div class="col-md-3">

                        <label for="monthYearPicker" class="form-label main-color">From</label>
                        <input type="date" class="form-control" [(ngModel)]="start_date">
                    </div>
                    <div class="col-md-3">

                        <label for="monthYearPicker" class="form-label main-color">To</label>
                        <input type="date" class="form-control" [(ngModel)]="end_date">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btnStyle text-white" (click)="getManagerPendingReports()"> Get </button>
                    </div>
                </div>
                
                <div>
                    <app-reports-table [reports]="reports" [isManager]="isManager" (approveMReport)="getManagerPendingReports()"></app-reports-table>
                </div>

            </ng-template>
            
        </p-tabPanel>
        <p-tabPanel header="All Pending Reports">

            <ng-template pTemplate="content">
                <div class="row align-items-end">
                    <div class="col-md-3">

                        <label for="monthYearPicker" class="form-label main-color">From</label>
                        <input type="date" class="form-control" [(ngModel)]="start_date">
                    </div>
                    <div class="col-md-3">

                        <label for="monthYearPicker" class="form-label main-color">To</label>
                        <input type="date" class="form-control" [(ngModel)]="end_date">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btnStyle text-white" (click)="getAllPendingReports()"> Get </button>
                    </div>
                </div>
                
                <div>
                    <app-reports-table [reports]="reports" [isManager]="isManager" (approveMReport)="getAllPendingReports()"></app-reports-table>
                </div>

            </ng-template>
            
        </p-tabPanel>
        <p-tabPanel header="My Monthly Reports">

            <ng-template pTemplate="content">
                <div class="row align-items-end">
                    <div class="col-md-3">

                        <label for="monthYearPicker" class="form-label main-color">From</label>
                        <input type="date" class="form-control" [(ngModel)]="start_date">
                    </div>
                    <div class="col-md-3">

                        <label for="monthYearPicker" class="form-label main-color">To</label>
                        <input type="date" class="form-control" [(ngModel)]="end_date">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btnStyle text-white" (click)="getManagerReports()"> Get </button>
                    </div>
                </div>
                
                <div>
                    <app-reports-table [reports]="reports" [isManager]="isManager" (approveMReport)="getManagerReports()"></app-reports-table>
                </div>

            </ng-template>
            
        </p-tabPanel>
        
    </p-tabView>

</div>
<div *ngIf="isProjectManager">
    <div class="row mx-0">
        <div class="col-md-3">

            <label for="monthYearPicker" class="form-label main-color">From</label>
            <input type="date" class="form-control" [(ngModel)]="start_date">
        </div>
        <div class="col-md-3">

            <label for="monthYearPicker" class="form-label main-color">To</label>
            <input type="date" class="form-control"[(ngModel)]="end_date">
        </div>
    </div>
    <app-reports-table [reports]="reports" [isManager]="isManager" [sidebarDisplay]="sidebarDisplay"
     (closeSideBar)="sidebarDisplay=false" (deletePmReport)="getPMMyReports()"></app-reports-table>
</div>
