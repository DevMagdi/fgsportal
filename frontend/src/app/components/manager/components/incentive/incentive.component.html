<div class="container-fluid" *ngIf="!!currentUser">
    <div class="row">
        <div class="col-md-12 mt-3">
            <mat-tab-group mat-align-tabs="start" class="">
                <mat-tab label="Requests" *ngIf="currentUser.accPosition == accPositionEnum.MANAGER">
                    <app-incentive-requests></app-incentive-requests>
                </mat-tab>

                <mat-tab [label]="lableName" *ngIf="currentUser.department == DepartmentEnum.ADMINSTRATION || currentUser.department == DepartmentEnum.MANAGEMENT">
                    <app-incentive-approved [currentUser]='currentUser'></app-incentive-approved>
                </mat-tab>

                <mat-tab label="Incentive History">
                    <app-incentive-history [currentUser]='currentUser'></app-incentive-history>
                </mat-tab>

            </mat-tab-group>
        </div>
    </div>
</div>
