<p-blockUI style="width: 100vw; height: 100vh;" [blocked]="loading">
    <p-progressSpinner></p-progressSpinner>
</p-blockUI>
<div class="mainPage">
    <div class="container-fluid m-0 p-0">
        <div class="row">
            <div class="col-lg-5">
                <div class="formSection">
                    <div class="container">
                        <!-- <div class="row m-2">
                            <div class="col-lg-10 m-auto">
                                <h1 class="form_header">set new password</h1>
                                <p>Must be at least 8 characters contain one number and includes both lower and uppercase letters and special characters</p>
                            </div>
                        </div> -->
                        <div class="row mt-3 p-3">
                            <div class="col-lg-10 m-auto">
                                <div >
                                    <h1 class="form_header">set new password</h1>
                                    <p>Must be at least 8 characters contain one number and includes both lower and uppercase letters and special characters</p>
                                </div>
                                <div class="alert alert-danger p-3 m-2" *ngIf="!!errMessage">
                                    {{errMessage}}
                                </div>
                                <form [formGroup]="resetPasswordForm" 
                                (ngSubmit)="validatePassowrd()" class="example-form">
                                    <div class="modal-body">
                                        <div class="container">
                                            <div class="row">
                                                <div class="col-lg-12 my-2">
                                                    <div class="wrap-input validate-input my-3"
                                                       data-validate="Valid email is required: ex@abc.xyz">
                                                        <label class="formLables">Password</label>
                                                        <input matInput class="form-control p-1 my-1" type="password" id="title" formControlName="password">
                                                        <mat-error class="alert help-block" *ngIf="!resetPasswordForm.get('password')?.valid && resetPasswordForm.get('password')?.touched">
                                                            Password Is Required
                                                        </mat-error>
                                                    </div>
                                                </div>
                                                <div class="col-lg-12 mb-2">
                                                    <div class="wrap-input validate-input my-3">
                                                        <label class="formLables">Confirm Password</label>
                                                        <input matInput class="form-control p-1 my-1" type="password" id="title" formControlName="confirmPassword">
                                                        <mat-error class="alert help-block" *ngIf="!resetPasswordForm.get('confirmPassword')?.valid && resetPasswordForm.get('confirmPassword')?.touched">
                                                            Confirm Password Is Required
                                                        </mat-error>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" *ngIf="!loading" class="btn submitFormBtn" [disabled]="resetPasswordForm.invalid">Submit</button>
                                        <button type="submit" *ngIf="!!loading" class="btn submitFormBtn" [disabled]="true">Loading....</button>
                                        <div class="mt-4 text-center mx-auto" routerLink="/signin">
                                            <span>
                                                <i class="material-icons arrowIcon m-auto"
                                                    >arrow_back</i>
                                            </span>
                                            <span class="backToLogin ps-2">Back to Login</span>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="imgSec text-center mt-5">
                    <img src="../../../assets/img/robot.png" class="mt-5" width="200" height="200" alt="">
                    <br>
                    <img src="../../../assets/img/Frame 4379.png" class="mt-4" width="405" height="70" alt="">
                    <h1 class="text-white p-4">Empowering businesses with AI-powered technology transformations.</h1>
                </div>
            </div>
        </div>
    </div>
</div>
