<div class="container mt-5">
    <div class="row">
        <div class="row">
            <div class="col-12">
                <mat-slide-toggle [checked]="showInKey" (change)="changeMode()"></mat-slide-toggle>
            </div>
        </div>
        <div class="col-12">
            <table class="table">
                <thead>
                    <th>ID</th>
                    <th>name</th>
                    <th style="max-width:600px; word-wrap: break-word;">action</th>
                    <th>status</th>
                    <th>date</th>
                </thead>
                <tbody>
                    <tr *ngFor="let log of myLogs">
                        <td>
                            {{log.key}}
                        </td>
                        <td>
                            {{log.empName}}
                        </td>
                        <td style="max-width:600px; word-wrap: break-word;">
                            <p *ngIf="!showInKey">
                                {{log.action}}
                            </p>
                            <p *ngIf="showInKey">
                                {{log.actionKeys}}
                            </p>
                        </td>
                        <td>
                            {{log.actionStatus}}
                        </td>
                        <td>
                            {{log.createdAt}}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
<button (click)="loadMore()">Load More</button>
