<div class="modules-dashboard container py-4">
  <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
    <div>
      <h2 class="mb-1">Modules</h2>
      <p class="text-muted mb-0">
        The modules available to your company. Disabled modules stay visible but
        cannot be opened until they are enabled.
      </p>
    </div>
  </div>

  <div *ngIf="loading" class="text-center text-muted py-5">
    <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
    Loading modules…
  </div>

  <div *ngIf="!loading" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let card of cards">
      <div
        class="card module-card h-100"
        [class.module-card--disabled]="!card.isEnabled"
        [class.module-card--core]="card.isCore"
        [attr.aria-disabled]="!card.isEnabled"
        [tabindex]="0"
        role="button"
        (click)="onCardClick(card)"
        (keyup.enter)="onCardClick(card)"
      >
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="module-card__icon" [class.module-card__icon--disabled]="!card.isEnabled">
              <i [class]="card.icon"></i>
            </span>
            <span *ngIf="card.isCore" class="badge bg-primary">Core</span>
            <span *ngIf="!card.isCore && card.isEnabled" class="badge bg-success">
              <i class="bx bx-check-circle me-1"></i>Enabled
            </span>
            <span *ngIf="!card.isEnabled" class="badge bg-secondary module-card__locked-badge">
              <i class="bx bx-lock-alt me-1"></i>Not enabled
            </span>
          </div>

          <h5 class="card-title mb-2">{{ card.name }}</h5>
          <p class="card-text text-muted flex-grow-1">{{ card.description }}</p>

          <div class="mt-3">
            <span *ngIf="card.isEnabled" class="btn btn-sm btn-outline-primary module-card__action">
              Open module <i class="bx bx-right-arrow-alt ms-1"></i>
            </span>
            <span *ngIf="!card.isEnabled" class="btn btn-sm btn-outline-secondary module-card__action module-card__action--locked">
              <i class="bx bx-lock-alt me-1"></i>Contact admin to enable
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
