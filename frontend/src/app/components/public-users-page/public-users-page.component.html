<div class="container-fluid mt-3" id="table">
    <div class="row my-5">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            <div class="search d-flex justify-content-center mt-5">
                <input type="text" class="form-control searchInput" [(ngModel)]="searchKey" (keyup)="userSearch()" placeholder="search by Username / Email / Account Type">
                <span class="material-icons searchIcon p-2">
                    search
                </span>
            </div>
        </div>
        <div class="col-md-3"></div>
    </div>
    <!-- <div class="row mt-5">
        <div class="container-fluid"> -->
            <div class="row">
                <div class="col-12">
                    <table class="table table-hover newTableCustom">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Avatar</th>
                                <th scope="col">Username</th>
                                <th scope="col">Email</th>
                                <th scope="col">Account Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let user of myUsersList; let i=index">
                                <td [routerLink]="['/user',user.key]" class="routing">{{i + 1}}</td>
                                <td [routerLink]="['/user',user.key]" class="routing">
                                    <img *ngIf="!!user.photoURL" src="{{newServerApi}}{{user.photoURL}}"
                                     class="rounded-circle" width="40px" height="40px" alt="">
                                    <img *ngIf="!user.photoURL && !user.gender || !user.photoURL && user.gender == 'male'" class="rounded-circle" src="../../../assets/img/avatarman.png" width="40px" height="40px" alt="">
                                    <img *ngIf="!user.photoURL && user.gender == 'female'" class="rounded-circle" src="../../../assets/img/girlmyavatar.png" width="40px" height="40px" alt="">
                                </td>
                                <td [routerLink]="['/user',user.key]" class="routing">{{user.username}}</td>
                                <td [routerLink]="['/user',user.key]" class="routing">{{user.email}}</td>
                                <td [routerLink]="['/user',user.key]" class="routing">{{user.department_name}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        <!-- </div>
    </div> -->

</div>
