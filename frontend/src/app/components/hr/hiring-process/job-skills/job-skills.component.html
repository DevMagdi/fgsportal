<div class="container-fluid mt-3">
    <div class="row">
      <div class="col-12 d-flex justify-content-between align-items-center">
        <h1 class="main-color p-2 mb-2 fw-bold">Job Skills</h1>
        <button *ngIf="checkIfHasPerm(29)" type="submit" class="btn btnStyle" (click)="openJobSkillManagement(0)">
          Add new Job Skill
        </button>
      </div>
      <div class="col-1"></div>
    </div>
    <div class="hrLine"></div>
    <div class="teble-responsive">
      <table class="table newTableCustom">
        <thead>
          <tr>
            <th>#</th>
            <th>Job Skill</th>
            <th></th>

          </tr>
        </thead>
        <tbody>
          <ng-container *ngIf="!!jobSkills && jobSkills!.length > 0">
            <tr *ngFor="let jobSkill of jobSkills; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ jobSkill.job_skill }}</td>

  
              <td>
                <i *ngIf="checkIfHasPerm(29)" (click)="openJobSkillManagement(jobSkill)" class="cursor pi pi-pencil text-info mx-1"></i>
                <i *ngIf="checkIfHasPerm(30)" (click)="deleteJobSkill(jobSkill)" class="cursor pi pi-trash text-danger mx-1"></i>
              </td>
            </tr>
          </ng-container>
          <ng-container *ngIf="jobSkills?.length == 0">
            <td [colSpan]="3" class="text-center">No Job Skills Founded</td>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
  
  <p-sidebar styleClass="p-sidebar-sm" class="side" [baseZIndex]="999" [autoZIndex]="false"
    [(visible)]="showJobSkillManagement" position="right" [transitionOptions]="'350ms'">
    <ng-template pTemplate="content">
      <app-job-skill-manangement [jobSkill]="selectedJobSkill"
        (updateJobSkillList)="updateJobSkillList($event)"></app-job-skill-manangement>
    </ng-template>
  </p-sidebar>
