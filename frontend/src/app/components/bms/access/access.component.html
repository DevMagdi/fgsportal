<div class="page-heading"><div><h1>{{lang.t('accessRoles')}}</h1><p>{{lang.t('accessSubtitle')}}</p></div><div class="button-row"><button class="btn-soft" (click)="excel()">{{lang.t('exportExcel')}}</button><button class="btn-soft" (click)="pdf()">{{lang.t('exportPdf')}}</button></div></div><div class="alert-box alert-error" *ngIf="error">{{error}}</div><div class="alert-box alert-success" *ngIf="success">{{success}}</div><section class="bms-card" *ngIf="can('roles.manage')"><h2>{{lang.t('assignRole')}}</h2><form class="form-grid" (ngSubmit)="assign()"><label>{{lang.t('employee')}}<select class="form-select" [(ngModel)]="assignment.user_id" name="user"><option value="">-</option><option *ngFor="let u of lookups.users" [value]="u.id">{{name(u)}}</option></select></label><label>{{lang.t('role')}}<select class="form-select" [(ngModel)]="assignment.role_id" name="role"><option value="">-</option><option *ngFor="let r of lookups.roles" [value]="r.id">{{r.name}}</option></select></label><label>{{lang.t('unitScope')}}<select class="form-select" [(ngModel)]="assignment.business_unit_id" name="unit"><option value="">{{lang.t('globalRole')}}</option><option *ngFor="let u of lookups.units" [value]="u.id">{{u.name}}</option></select></label><div class="button-row"><button class="btn-brand" type="submit">{{lang.t('assign')}}</button><button class="btn-soft" type="button" (click)="revoke()">{{lang.t('revoke')}}</button></div></form></section><section class="bms-card"><h2>{{lang.t('roleMatrix')}}</h2><div class="table-responsive"><table><thead><tr><th>{{lang.t('role')}}</th><th>{{lang.t('permissions')}}</th></tr></thead><tbody><tr *ngFor="let role of lookups.roles"><td><strong>{{role.name}}</strong><div class="small muted">{{role.slug}}</div></td><td><span class="department-chip" *ngFor="let ability of role.abilities">{{ability}}</span></td></tr></tbody></table></div></section>
