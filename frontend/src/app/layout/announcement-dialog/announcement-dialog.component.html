<p-dialog *ngIf="session.runningAnnounces.length > 0 && session.announceToDisplay" [(visible)]="session.displayAnnounce"
  [style]="{ width: '70vw', scale: '0.9' }" [breakpoints]="{ '960px': '50vw', '640px': '100vw' }" [modal]="true"
  [draggable]="false" [resizable]="false" header>
  <ng-template pTemplate="header">
    <div class="announeHeader m-auto">
      <h3>{{ session.announceToDisplay.title }}</h3>
    </div>
  </ng-template>
  <div [dir]="session.announceToDisplay.language" class="container">
    <div *ngIf="!!session.announceToDisplay.imgURL && session.announceToDisplay.imgURL.length > 0" class="row">
      <div class="col-md-6">
        <div class="announceImg">
          <img src="{{ newServerApi }}{{ session.announceToDisplay.imgURL }}" alt width="100%" height="100%">
        </div>
      </div>
      <div class="col-md-6">
        <div [style.text-align]="session.announceToDisplay.language == 'rtl' ? 'right' : 'left'"
          [innerHTML]="session.announceToDisplay.body" class="announceBody ql-editor"></div>
      </div>
    </div>
    <div *ngIf="!session.announceToDisplay.imgURL" class="row">
      <div class="col-12">
        <div [style.text-align]="session.announceToDisplay.language == 'rtl' ? 'right' : 'left'"
          [innerHTML]="session.announceToDisplay.body" class="announceBody ql-editor"></div>
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button (click)="acknowledge()" icon="pi pi-check" label="Ok" styleClass="p-button-text"></p-button>
  </ng-template>
</p-dialog>
