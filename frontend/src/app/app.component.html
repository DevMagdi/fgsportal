
<!--
  Signed in: every page renders inside the single application shell (one sidebar, one header, one outlet).

  The two states share one *ngIf / else on purpose. Each holds a primary <router-outlet>, and the router
  keeps a single registration for it: the outgoing outlet must be destroyed before the incoming one is
  created, otherwise the outgoing outlet's teardown clears the registration of the new one and pages stop
  rendering after sign-in or sign-out until the browser is reloaded.
-->
<div *ngIf="loggedIn; else signedOut">
    <alphaiota-loading></alphaiota-loading>
    <app-shell></app-shell>
</div>

<ng-template #signedOut>
    <div class="main">
        <alphaiota-loading></alphaiota-loading>
        <router-outlet></router-outlet>
    </div>
</ng-template>
