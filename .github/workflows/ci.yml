name: CI

on:
  pull_request:
    branches: [BMS]
  push:
    branches: [BMS]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, curl, zip, pdo_sqlite, pdo_mysql, pcov
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php
      - name: Prepare application
        id: prepare
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret
      - name: Native syntax check for Phase 3 PHP changes
        if: always() && steps.prepare.outcome == 'success'
        run: |
          php -l backend/app/Http/Controllers/BMS/ExecutiveDashboardController.php
          php -l backend/tests/Feature/P17EmployeeManagementTest.php
      - name: Focused P22 selected-unit regression
        id: p22
        if: always() && steps.prepare.outcome == 'success'
        working-directory: backend
        run: vendor/bin/phpunit tests/Feature/P17EmployeeManagementTest.php --filter test_P22_dashboard_recent_activity_respects_selected_unit_including_shared_products
      - name: Focused related dashboard and recent-activity regressions
        id: related_dashboard_tests
        if: always() && steps.prepare.outcome == 'success'
        working-directory: backend
        shell: bash
        run: |
          set +e
          status=0
          for test in \
            test_P18_dashboard_reports_pending_procurement_upcoming_meetings_and_overdue_tasks \
            test_P19_recent_activity_never_leaks_other_units_records \
            test_P20_recent_activity_separates_ids_shared_across_model_types_and_handles_deleted_records \
            test_P20_dashboard_summary_matches_the_widget_data_under_the_same_filters; do
            echo "===== $test ====="
            vendor/bin/phpunit tests/Feature/P17EmployeeManagementTest.php --filter "$test"
            result=$?
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Focused P1.1 dashboard-card regression
        if: always() && steps.prepare.outcome == 'success'
        working-directory: backend
        run: vendor/bin/phpunit tests/Feature/P1Batch1Test.php --filter test_P1_1_dashboard_card_lists_employees_without_task_bodies
      - name: Test SQLite with coverage
        id: full_suite
        if: always() && steps.prepare.outcome == 'success'
        working-directory: backend
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then echo "::error::PHPUNIT_BASE64=$((grep -A100 -E '^There (was|were)|^Tests:|^OK' test-output.txt || tail -n 40 test-output.txt) | gzip -9 | base64 -w0)"; fi
          exit "$status"
      - name: Report SQLite test summary
        if: always() && steps.prepare.outcome == 'success' && steps.full_suite.outcome == 'success'
        working-directory: backend
        run: echo "::notice::SQLITE_$(grep -E '^(OK|Tests:)' test-output.txt | tail -n 1)"
      - name: Test MySQL 8
        if: always() && steps.prepare.outcome == 'success'
        working-directory: backend
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit -c phpunit.mysql.xml > mysql-test-output.txt 2>&1
          status=$?
          cat mysql-test-output.txt
          if [ "$status" -ne 0 ]; then echo "::error::MYSQL_BASE64=$(tail -n 80 mysql-test-output.txt | base64 -w0)"; else echo "::notice::MYSQL_$(grep -E '^(OK|Tests:)' mysql-test-output.txt | tail -n 1)"; fi
          exit "$status"
      - name: Lint BMS PHP
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: composer lint
      - name: Analyse BMS PHP
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: composer analyse

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Lint BMS Angular
        continue-on-error: true
        working-directory: frontend
        run: npm run lint
      - name: Test Angular
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npx ng test --watch=false --browsers=ChromeHeadless > angular-test-output.txt 2>&1
          status=$?
          cat angular-test-output.txt
          if [ "$status" -ne 0 ]; then echo "::error::ANGULAR_BASE64=$(tail -n 100 angular-test-output.txt | gzip -9 | base64 -w0)"; fi
          exit "$status"
      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production
