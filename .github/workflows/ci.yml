name: CI

on:
  pull_request:
    branches: [BMS]
  push:
    branches: [BMS]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, curl, zip, pdo_sqlite, pdo_mysql, pcov
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php
      - name: Prepare application
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret
      - name: Test SQLite with coverage
        working-directory: backend
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
      - name: Test MySQL 8
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.mysql.xml
      - name: Lint BMS PHP
        working-directory: backend
        run: composer lint
      - name: Analyse BMS PHP
        working-directory: backend
        run: composer analyse

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Lint BMS Angular
        working-directory: frontend
        run: npm run lint
      - name: Test Angular
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production
